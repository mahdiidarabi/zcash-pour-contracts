specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ZcashPourPool
    network: sepolia
    source:
      address: "0x9097c70e0aCE543FE9cE07393b3865864cEF6C5f"
      abi: ZcashPourPool
      startBlock: 11436530
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - Commitment
        - Nullifier
        - Mint
        - Pour
        - Burn
        - Pool
      abis:
        - name: ZcashPourPool
          file: ./abis/ZcashPourPool.json
      eventHandlers:
        - event: CommitBurnt(uint256,address,bool)
          handler: handleCommitBurnt
        - event: Minted(uint256,uint256,uint256,uint256,uint256,address)
          handler: handleMinted
        - event: Poured(uint256,uint256,address)
          handler: handlePoured
      file: ./src/zcash-pour-pool.ts
